groups:
  - name: taxi-pipeline
    rules:
      - alert: PipelineFailure
        expr: pipeline_last_partition_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Latest pipeline partition failed"

      - alert: NoDataReceived
        expr: pipeline_rows_transformed_total == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pipeline produced zero rows"

      - alert: HighJobFailureRate
        expr: pipeline_job_failures_total > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 3 pipeline runs have failed"

      - alert: SlowPipeline
        expr: pipeline_run_duration_seconds > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline run exceeded 1 hour"
